[package]
name = "ste-explorer"
version = "0.9.0"
description = "ST Explorer - SillyTavern 聊天记录、世界书、预设与资产管理工具"
authors = ["LYC619"]
license = "AGPL-3.0-only"
repository = "https://github.com/LYC619/silly-tavern-explorer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
base64 = "0.22"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }

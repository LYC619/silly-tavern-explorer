[package]
name = "app"
version = "0.18.0"
description = "SillyTavern Chat Beautifier - 聊天记录处理、世界书编辑与 AI 辅助工具"
authors = ["LYC619"]
license = "MIT"
repository = "https://github.com/LYC619/silly-tavern-explorer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"

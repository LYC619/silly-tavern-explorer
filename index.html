<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ST Explorer</title>
    <script>
      (() => {
        const themes = ['cocoa', 'ink', 'midnight', 'cream'];
        let theme = 'cocoa';
        try {
          const saved = localStorage.getItem('ste-theme');
          if (saved && themes.includes(saved)) theme = saved;
        } catch {
          // 首屏脚本不能阻塞应用启动，异常时使用默认深色主题。
        }
        const root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.toggle('dark', theme !== 'cream');
      })();
    </script>
    <meta name="description" content="ST Explorer - SillyTavern 角色卡与聊天记录的一站式归档库" />
    <meta name="author" content="ST Explorer" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:title" content="ST Explorer" />
    <meta property="og:description" content="SillyTavern 角色卡与聊天记录的一站式归档库" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

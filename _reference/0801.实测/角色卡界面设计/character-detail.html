<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8" />

<title>SillyTavern Explorer 2.0 · 角色卡详情（单文件参考版）</title>
<!--
  这是 Next.js 版本的单文件等价实现，供项目内 agent 参考布局与交互逻辑。
  图片使用相对路径 public/images/*，从仓库根目录打开即可。
  切换浅色：把 <html class="dark"> 改成 <html class="light">
-->
<style>
  :root {
    --background: oklch(0.973 0.007 85);
    --foreground: oklch(0.26 0.012 60);
    --card: oklch(0.988 0.005 85);
    --popover: oklch(0.992 0.004 85);
    --primary: oklch(0.63 0.135 55);
    --primary-foreground: oklch(0.99 0.005 85);
    --muted: oklch(0.947 0.009 85);
    --muted-foreground: oklch(0.55 0.014 65);
    --accent: oklch(0.93 0.022 80);
    --accent-foreground: oklch(0.35 0.05 55);
    --destructive: oklch(0.55 0.19 25);
    --border: oklch(0.9 0.012 80);
    --sidebar: oklch(0.962 0.009 85);
    --radius: 0.5rem;
  }
  html.dark {
    --background: oklch(0.185 0.008 60);
    --foreground: oklch(0.93 0.008 85);
    --card: oklch(0.225 0.009 60);
    --popover: oklch(0.235 0.009 60);
    --primary: oklch(0.68 0.13 55);
    --primary-foreground: oklch(0.18 0.01 60);
    --muted: oklch(0.27 0.01 60);
    --muted-foreground: oklch(0.68 0.012 70);
    --accent: oklch(0.32 0.03 55);
    --accent-foreground: oklch(0.88 0.05 70);
    --destructive: oklch(0.65 0.18 25);
    --border: oklch(0.9 0.02 80 / 12%);
    --sidebar: oklch(0.21 0.009 60);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
    background: var(--background);
    color: var(--foreground);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
  }
  .serif { font-family: "Noto Serif SC", ui-serif, Georgia, serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  .muted { color: var(--muted-foreground); }

  /* ---------- shell ---------- */
  .shell { display: flex; flex: 1; min-height: 0; }
  .rail {
    width: 80px; flex: 0 0 80px; background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 0;
  }
  .rail-brand { font-family: "Noto Serif SC", serif; font-size: 13px; line-height: 1.3; text-align: center; padding: 0 8px 14px; }
  .rail-item {
    width: 60px; padding: 8px 0; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; font-size: 11px; color: var(--muted-foreground); position: relative;
  }
  .rail-item:hover { background: var(--muted); color: var(--foreground); }
  .rail-item.on { background: var(--accent); color: var(--accent-foreground); }
  .rail-item .badge {
    position: absolute; top: 4px; right: 10px; background: var(--primary); color: var(--primary-foreground);
    border-radius: 999px; font-size: 9px; padding: 0 4px;
  }
  .body { display: flex; flex: 1; min-width: 0; }

  /* ---------- info panel (固定，不随右侧滚动) ---------- */
  .info {
    width: 272px; flex: 0 0 272px; display: flex; flex-direction: column; gap: 16px;
    padding: 24px 20px; background: color-mix(in oklab, var(--card) 60%, transparent);
    border-right: 1px solid var(--border);
  }
  .portrait { position: relative; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--muted); }
  .portrait img { display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; transition: transform .5s; }
  .portrait:hover img { transform: scale(1.03); }
  .portrait .zoom {
    position: absolute; inset: auto 0 0 0; padding: 6px; font-size: 11px; text-align: center;
    background: color-mix(in oklab, var(--foreground) 55%, transparent); color: var(--background);
    opacity: 0; transition: opacity .2s;
  }
  .portrait:hover .zoom { opacity: 1; }
  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .row dt { font-size: 12px; color: var(--muted-foreground); flex: 0 0 auto; }
  .row dd { font-size: 13px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-row {
    border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px;
  }
  .act-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 8px; border-radius: 6px;
  }
  .act-btn:hover { background: var(--muted); }

  /* ---------- main ---------- */
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .head { display: flex; flex-direction: column; gap: 12px; }
  .head-top { display: flex; align-items: flex-start; gap: 12px; }
  h1 { font-family: "Noto Serif SC", serif; font-weight: 500; letter-spacing: -.01em; flex: 1; min-width: 0; }
  h1.open { font-size: 34px; line-height: 1.25; }
  h1.closed { font-size: 22px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { padding: 6px; border-radius: 6px; color: var(--muted-foreground); display: inline-flex; }
  .icon-btn:hover { background: var(--muted); color: var(--foreground); }
  .ghost-btn {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px;
    font-size: 12px; color: var(--muted-foreground);
  }
  .ghost-btn:hover { background: var(--muted); color: var(--foreground); }
  .byline { display: flex; gap: 8px; font-size: 14px; color: var(--muted-foreground); }
  .intro { max-width: 62ch; font-size: 15px; line-height: 1.65; color: color-mix(in oklab, var(--foreground) 80%, transparent); }

  /* ---------- tags ---------- */
  .tagbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .nsfw { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .switch { width: 34px; height: 18px; border-radius: 999px; background: var(--muted); border: 1px solid var(--border); position: relative; transition: background .2s; }
  .switch i { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 999px; background: var(--muted-foreground); transition: all .2s; }
  .switch.on { background: var(--primary); }
  .switch.on i { left: 18px; background: var(--primary-foreground); }
  .tag-group { display: inline-flex; align-items: center; gap: 4px; }
  .tag-group > span { font-size: 11px; color: var(--muted-foreground); }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); font-size: 12px; background: var(--card);
  }
  .tag.custom { border-style: dashed; }
  .tag button { color: var(--muted-foreground); font-size: 12px; line-height: 1; }
  .tag button:hover { color: var(--destructive); }
  .tag-add { border: 1px dashed var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted-foreground); }
  .tag-add:hover { color: var(--foreground); }

  /* ---------- nav ---------- */
  nav.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; font-size: 15px; color: var(--muted-foreground); }
  .tab:hover { background: var(--muted); color: var(--foreground); }
  .tab.on { background: var(--accent); color: var(--accent-foreground); }
  .tab .cnt { font-family: ui-monospace, monospace; font-size: 10px; padding: 1px 4px; border-radius: 4px; background: var(--muted); }
  .tab.on .cnt { background: color-mix(in oklab, var(--primary) 18%, transparent); }
  .sep { width: 1px; height: 16px; background: var(--border); margin: 0 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); font-size: 13px; background: var(--card);
  }
  .btn:hover { background: var(--muted); }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .push { margin-left: auto; }

  /* ---------- lists / cards ---------- */
  .panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-title { font-family: "Noto Serif SC", serif; font-size: 17px; }
  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 12px 14px; }
  .item { display: flex; align-items: center; gap: 12px; }
  .item + .item { margin-top: 8px; }
  .item.on { border-color: color-mix(in oklab, var(--primary) 55%, var(--border)); box-shadow: inset 3px 0 0 var(--primary); }
  .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .item-title { font-size: 14px; }
  .item-sub { font-size: 12px; color: var(--muted-foreground); }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
  .chip.run { color: var(--accent-foreground); background: var(--accent); border-color: transparent; }
  .item-acts { display: flex; align-items: center; gap: 4px; }
  .stale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); border: 1px dashed var(--border); border-radius: 6px; padding: 8px 10px; }
  .empty { font-size: 13px; color: var(--muted-foreground); border: 1px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; }
  select.switcher { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; }

  /* ---------- reader ---------- */
  .msg { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--card); }
  .msg.user { background: color-mix(in oklab, var(--muted) 55%, transparent); }
  .msg-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 6px; }
  .msg p { line-height: 1.8; font-size: 15px; }

  /* ---------- tree ---------- */
  .node { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .node .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--border); flex: 0 0 auto; }
  .node.active .dot { background: var(--primary); }

  /* ---------- portraits ---------- */
  .prow { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .prow-head { display: flex; align-items: center; gap: 8px; }
  .prow-head input { flex: 1; min-width: 0; background: none; border: 0; border-bottom: 1px dashed transparent; font-size: 15px; font-family: "Noto Serif SC", serif; padding: 2px 0; }
  .prow-head input:hover, .prow-head input:focus { border-bottom-color: var(--border); outline: none; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .strip.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); overflow: visible; }
  .pcard { width: 124px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
  .strip.grid .pcard { width: auto; }
  .pcard img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .pcard.cur img { outline: 2px solid var(--primary); outline-offset: 1px; }
  .pcard .cap { font-size: 11px; color: var(--muted-foreground); display: flex; justify-content: space-between; gap: 4px; }

  /* ---------- overlays ---------- */
  .scrim { position: fixed; inset: 0; z-index: 50; background: color-mix(in oklab, var(--foreground) 45%, transparent); }
  .side {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(320px, 86vw);
    background: var(--popover); border-left: 1px solid var(--border); padding: 20px;
    display: flex; flex-direction: column; gap: 16px; box-shadow: -12px 0 40px rgba(0,0,0,.28);
  }
  .side.wide { width: min(420px, 92vw); }
  .side-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .side-title { font-family: "Noto Serif SC", serif; font-size: 18px; }
  .side-sub { font-size: 12px; color: var(--muted-foreground); }
  .side-list { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--border); padding-top: 12px; }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 6px; font-size: 14px; }
  .side-item:hover { background: var(--muted); }
  .side-item.danger { color: var(--destructive); }
  .side-item.danger:hover { background: color-mix(in oklab, var(--destructive) 12%, transparent); }
  .modal {
    position: fixed; z-index: 51; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow-y: auto;
    background: var(--popover); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 12px; color: var(--muted-foreground); }
  .field input, .field textarea {
    background: var(--background); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 14px;
  }
  .field textarea { resize: vertical; line-height: 1.6; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
  .kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kind { border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: left; font-size: 13px; }
  .kind.on { border-color: var(--primary); background: var(--accent); color: var(--accent-foreground); }
  .drop { border: 1px dashed var(--border); border-radius: 8px; padding: 22px; text-align: center; font-size: 13px; color: var(--muted-foreground); }
  .lightbox { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 32px; background: color-mix(in oklab, var(--foreground) 72%, transparent); }
  .lightbox img { max-height: 100%; max-width: 100%; border-radius: 8px; }
  .help { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--border); font-size: 10px; color: var(--muted-foreground); cursor: help; }

  /* ---------- status bar ---------- */
  .status {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--border); background: var(--sidebar); padding: 8px 20px; font-size: 12px; color: var(--muted-foreground);
  }
  .status code { font-family: ui-monospace, monospace; color: var(--primary); }

  .hidden { display: none !important; }

  @media (max-width: 1024px) {
    .body { flex-direction: column; overflow-y: auto; }
    .info { width: 100%; flex: 0 0 auto; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--border); }
    .info .portrait { width: 132px; flex: 0 0 132px; height: fit-content; }
    .rows { flex: 1; min-width: 0; }
    main { overflow: visible; }
  }
</style>
</head>

const TZ = "Asia/Shanghai";
function dtParts(iso) {
  const f = new Intl.DateTimeFormat("zh-CN", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date(iso));
  const g = (t) => (f.find((p) => p.type === t) || {}).value || "00";
  return { y: g("year"), M: g("month"), d: g("day"), h: g("hour"), m: g("minute") };
}
const absDate = (iso) => { const p = dtParts(iso); return `${p.y}/${+p.M}/${+p.d}`; };
const absDateTime = (iso) => { const p = dtParts(iso); return `${absDate(iso)} - ${p.h}:${p.m}`; };
function relTime(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 60000;
  if (diff < 1) return "刚刚";
  if (diff < 60) return `${Math.round(diff)} 分钟前`;
  if (diff < 1440) return `${Math.round(diff / 60)} 小时前`;
  if (diff < 43200) return `${Math.round(diff / 1440)} 天前`;
  return absDate(iso);
}
const num = (n) => n.toLocaleString("zh-CN");
const dur = (min) => (min < 60 ? `${min} 分钟` : `${Math.floor(min / 60)} 小时 ${min % 60} 分`);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    g.items.push(t);
  });
  groups.sort((a, b) => Number(a.builtin === false) - Number(b.builtin === false));

  el("tagbar").innerHTML = `
    <span class="nsfw">
      NSFW

function bindView() {
  const q = (sel) => Array.from(el("view").querySelectorAll(sel));

  q("[data-story]").forEach((n) => (n.onclick = (e) => { if (e.target.closest("[data-read],[data-proc],[data-exp]")) return; openStory(n.dataset.story); }));
  q("[data-read]").forEach((b) => (b.onclick = () => openStory(b.dataset.read)));
  q("[data-proc]").forEach((b) => (b.onclick = () => { state.storyId = b.dataset.proc; state.subOpen = true; state.tab = "summary"; render(); }));
  q("[data-exp]").forEach((b) => (b.onclick = () => alert("导出该故事为 JSONL（示意）")));
  const back = el("backList"); if (back) back.onclick = closeReaderAndRender;
  const sel = el("storySel"); if (sel) sel.onchange = () => { state.storyId = sel.value; renderView(); };
  const an = el("addNote"); if (an) an.onclick = () => alert("新建备注（示意）");
  const ia = el("impAsset"); if (ia) ia.onclick = () => openImport("worldbook");
  const ip = el("impPortrait"); if (ip) ip.onclick = () => openImport("portrait");
  const ar = el("addRow"); if (ar) ar.onclick = () => { state.rows.push({ id: "r" + Date.now(), title: "新的分行", items: [] }); renderView(); };

  q("[data-asset]").forEach((b) => (b.onclick = () => openAsset(b.dataset.asset)));
  q("[data-rowtoggle]").forEach((b) => (b.onclick = () => { const id = b.dataset.rowtoggle; state.expandedRows[id] = !state.expandedRows[id]; renderView(); }));
  q("[data-rowimp]").forEach((b) => (b.onclick = () => openImport("portrait")));
  q("[data-rowtitle]").forEach((i) => (i.onchange = () => { const r = state.rows.find((x) => x.id === i.dataset.rowtitle); r.title = i.value; }));
  q("[data-zoom]").forEach((b) => (b.onclick = () => openLightbox(b.dataset.zoom)));
  q("[data-setcur]").forEach((b) => (b.onclick = () => {
    state.rows.forEach((r) => r.items.forEach((p) => (p.current = p.id === b.dataset.setcur)));
    renderInfo(); renderView();
  }));
}

/* =======================  交互  ======================= */
function openStory(id) { state.storyId = id; state.readerOpen = true; state.headerOpen = false; render(); }
function closeReader() { state.readerOpen = false; state.headerOpen = true; }          // 返回列表时自动展开简介
function closeReaderAndRender() { closeReader(); render(); }

/* --- 弹层 --- */
function closeOverlay() { el("overlay").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

function openActionPanel() {
  const items = [
    { id: "edit", label: "编辑角色卡" },
    { id: "read-builtin", label: "读取内置资源", hint: "读取角色卡文件里自带的世界书、预设、正则等内容，导入后会出现在「关联资产」中。" },
    { id: "export", label: "导出角色卡" },
    { id: "delete", label: "删除角色卡", danger: true },
  ];
  el("overlay").innerHTML = `
    <div class="scrim" data-close></div>
    <aside class="side" role="dialog" aria-modal="true" aria-label="角色卡操作">
      <div class="side-head">
        <div>
          <div class="side-title">角色卡操作</div>
          <div class="side-sub">${esc(state.meta.name)}</div>
        </div>
        <button class="icon-btn" data-close aria-label="关闭">✕</button>
      </div>
      <div class="side-list">
        ${items.map((i) => `
          <div style="display:flex;align-items:center;gap:6px">
            <button class="side-item ${i.danger ? "danger" : ""}" data-act="${i.id}" style="flex:1">${i.label}</button>
            ${i.hint ? `<span class="help" title="${esc(i.hint)}">?</span>` : ""}
          </div>`).join("")}
      </div>
    </aside>`;
  bindOverlay();
  el("overlay").querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => { closeOverlay(); cardAction(b.dataset.act); }));
}

function cardAction(id) {
  if (id === "edit") return openMetaEditor();
  if (id === "read-builtin") { state.tab = "assets"; render(); return openImport("worldbook"); }
  alert(id === "export" ? "导出角色卡（示意）" : "删除角色卡（示意）");
}

function openMetaEditor() {
  const m = state.meta;
  el("overlay").innerHTML = `
    <div class="scrim" data-close></div>
    <div class="modal" role="dialog" aria-modal="true" aria-label="编辑展示信息">
      <div class="side-head">
        <div>
          <div class="side-title">编辑展示信息</div>
          <div class="side-sub">只改本地展示内容，不写回角色卡原件</div>
        </div>
        <button class="icon-btn" data-close aria-label="关闭">✕</button>
      </div>
      <label class="field"><span>展示名称</span><input id="mName" value="${esc(m.name)}" /></label>
      <div style="display:flex;gap:12px">
        <label class="field" style="flex:1"><span>作者</span><input id="mCreator" value="${esc(m.creator)}" /></label>
        <label class="field" style="flex:1"><span>来源</span><input id="mSource" value="${esc(m.source)}" /></label>
      </div>
      <label class="field"><span>简介</span><textarea id="mIntro" rows="5">${esc(m.intro)}</textarea></label>
      <div class="modal-foot">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="mSave">保存</button>
      </div>
    </div>`;
  bindOverlay();
  el("mSave").onclick = () => {
    state.meta = { name: el("mName").value, creator: el("mCreator").value, source: el("mSource").value, intro: el("mIntro").value };
    closeOverlay(); renderHeader();
  };
}

const IMPORT_KINDS = [
  { id: "story", label: "故事记录", desc: "SillyTavern 的 .jsonl 聊天记录" },
  { id: "worldbook", label: "世界书", desc: "lorebook / world info 的 .json" },
  { id: "preset", label: "预设", desc: "采样参数与提示词预设" },
  { id: "regex", label: "正则", desc: "显示层的替换规则" },
  { id: "quote", label: "引用", desc: "摘录、语料片段" },
  { id: "portrait", label: "立绘 / 卡面", desc: "png / jpg / webp，可设为当前卡面" },
];
function openImport(kind) {
  let cur = kind || "story";
  const draw = () => {
    el("overlay").innerHTML = `
      <div class="scrim" data-close></div>
      <div class="modal" role="dialog" aria-modal="true" aria-label="导入">
        <div class="side-head">
          <div>
            <div class="side-title">导入</div>
            <div class="side-sub">先选类型，再选择文件；导入的内容会归到这张角色卡下</div>
          </div>
          <button class="icon-btn" data-close aria-label="关闭">✕</button>
        </div>
        <div class="kinds">
          ${IMPORT_KINDS.map((k) => `
            <button class="kind ${k.id === cur ? "on" : ""}" data-kind="${k.id}">
              <div>${k.label}</div><div style="font-size:11px;opacity:.75;margin-top:2px">${k.desc}</div>
            </button>`).join("")}
        </div>
        <div class="drop">把文件拖到这里，或点击选择<br /><span style="font-size:11px">当前类型：${IMPORT_KINDS.find((k) => k.id === cur).label}</span></div>
        <div class="modal-foot">
          <button class="btn" data-close>取消</button>
          <button class="btn primary" data-close>开始导入</button>
        </div>
      </div>`;
    bindOverlay();
    el("overlay").querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => { cur = b.dataset.kind; draw(); }));
  };
  draw();
}

function openAsset(id) {
  const a = assets.find((x) => x.id === id);
  el("overlay").innerHTML = `
    <div class="scrim" data-close></div>
    <aside class="side wide" role="dialog" aria-modal="true" aria-label="资产详情">
      <div class="side-head">
        <div>
          <div class="side-sub">${a.kind} · 导入于 ${absDate(a.importedAt)}</div>
          <div class="side-title">${esc(a.name)}</div>
          <div class="side-sub">${esc(a.meta)}</div>
        </div>
        <button class="icon-btn" data-close aria-label="关闭">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;overflow-y:auto">
        ${a.entries.map((e) => `
          <div class="card">
            <div class="item-title" style="margin-bottom:4px">${esc(e.title)}</div>
            ${e.keys ? `<div class="item-sub" style="font-family:ui-monospace,monospace;margin-bottom:6px">${esc(e.keys)}</div>` : ""}
            <p style="line-height:1.75;font-size:13px">${esc(e.body)}</p>
          </div>`).join("")}
      </div>
      <div class="modal-foot"><button class="btn" data-close>关闭</button><button class="btn">在编辑器中打开</button></div>
    </aside>`;
  bindOverlay();
}

function openLightbox(src) {
  el("overlay").innerHTML = `<div class="lightbox" data-close><img src="${src}" alt="立绘放大" /></div>`;
  bindOverlay();
}

function bindOverlay() {
  el("overlay").querySelectorAll("[data-close]").forEach((n) => (n.onclick = closeOverlay));
}

/* =======================  启动  ======================= */
function render() { renderInfo(); renderHeader(); renderTabs(); renderView(); }

el("headToggle").onclick = () => { state.headerOpen = !state.headerOpen; renderHeader(); };
el("metaBtn").onclick = openMetaEditor;
el("portraitBtn").onclick = () => openLightbox(curPortrait().src);
el("stLeft").innerHTML = `已接入 ST 目录 · <code>${esc(stStatus.path)}</code>`;
el("stRight").textContent = stStatus.version;
render();
</script>
</body>
</html>
